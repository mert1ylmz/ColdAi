name: cold_assistant_ai
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  auto_size_text: ^3.0.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.4.0

  # HTTP (API için)
  http: ^1.2.2

  # Kamera & Galeri
  image_picker: ^1.1.2

  # 🔥 MIME TYPE FIX (çok önemli)
  mime: ^1.0.6
  http_parser: ^4.0.2

  # Splash
  flutter_native_splash: ^2.4.4
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/Logo.png
  android: true
  ios: true